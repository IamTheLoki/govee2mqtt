name: Release

on:
  release:
    types: [published]
  workflow_dispatch: # Erlaubt manuellen Build über den Actions-Tab

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Eigenes target-Verzeichnis: cross baut im Container mit älterer glibc und
      # kann dort keine auf dem Runner kompilierten Build-Skripte wiederverwenden
      - name: Run Tests
        run: cargo test --release --target-dir target/test

      # 1. Repository-Namen in Kleinbuchstaben umwandeln (GHCR verlangt das)
      #    und Version bestimmen (Release-Tag, sonst Version aus der Cargo.toml)
      - name: Prepare names
        run: |
          echo "GHCR_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          VERSION="${{ github.event.release.tag_name }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # 2. Statisch gelinktes Binary (musl) per cross bauen, das Dockerfile kopiert es nur
      - name: Install cross
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cross

      - name: Build executable
        run: ./scripts/build-cross.sh linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 3. Login bei der GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build & Push (nur linux/amd64)
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ghcr.io/${{ env.GHCR_REPO }}:latest
            ghcr.io/${{ env.GHCR_REPO }}:${{ env.VERSION }}

      # 5. Binary als GitHub Release-Artefakt bereitstellen
      - name: Generate Release Artifacts
        if: github.event_name == 'release'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "docker-target/linux/amd64/govee"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
